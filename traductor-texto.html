<!DOCTYPE html><!--Es una declaracion, no una etiqueta, indica que el archivo es HTML5 -->
<html lang="es"><!--Establece el idioma del documento -->
<head>
    <meta charset="UTF-8"> <!-- Especifica la codificación de caracteres -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--Responsiva, ajuste del tamaño de la pantalla -->
    <title>Indus.com.yo</title>
    <link rel="stylesheet" href="estilo-texto.css"> <!-- Enlace a la hoja de estilos CSS -->
</head>

<body>
    <header class="barra-superior"> <!--Class es mas reutilizable para darle diseño, mientras que ID se reserva mas para JavaScript y enlaces-->
    <div class="nav-izquierda"> <!--Usamos div para agrpar elementos -->
      <a href="javascript:void(0)" class="logo">Indus</a> <!--javascript:void(0) evita que el enlace se siga, se queda en la pagina -->
      <nav class="enlaces">
        <a href="index.html" class="btn-nav">Inicio</a>
        <a href="traductor-texto.html" class="btn-nav-text activo">Traductor de texto</a>
        <a href="traductor-archivos.html" class="btn-nav-ar">Traductor de archivos</a>
      </nav>
    </div>
    <button class="btn-buscar" aria-label="Buscar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </button>
    </header>
    <main class="contenedor-traductor">
  <h1 class="titulo-traductor">Traductor de texto</h1>
  <p class="subtitulo-traductor">Escribe o pega tu texto y tradúcelo entre inglés y español.</p>

  <div class="barra-idiomas">
    <div class="selector-idioma">
      <span class="txt-idioma">Inglés</span>
      <span class="flecha-abajo">▼</span>
    </div>
    
    <button class="btn-intercambiar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M7 16V4M7 4L3 8M7 4L11 8M17 8v12M17 20l4-4M17 20l-4-4"/>
      </svg>
    </button>

    <div class="selector-idioma">
      <span class="txt-idioma">Español</span>
      <span class="flecha-abajo">▼</span>
    </div>
  </div>

  <div class="paneles-texto">
    <div class="tarjeta-texto">
      <div class="encabezado-tarjeta">
        <h3>Texto original</h3>
        <span class="indicador-idioma">Inglés</span>
      </div>
      <textarea class="campo-texto" placeholder="Escribe o pega aquí el texto que quieres traducir..."></textarea>
    </div>

    <div class="tarjeta-texto panel-traduccion">
      <div class="encabezado-tarjeta">
        <h3>Traducción</h3>
        <span class="indicador-idioma">Español</span>
      </div>
      <textarea class="campo-texto" placeholder="La traducción aparecerá aquí." readonly></textarea>
    </div>
  </div>
</main>

</body>
</html>
